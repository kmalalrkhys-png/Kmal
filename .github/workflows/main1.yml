name: Run Windows 11 with Tailscale & QEMU

on:
  workflow_dispatch:
    inputs:
      tailscale_authkey:
        description: 'Tailscale Auth Key (أدخل مفتاح المصادقة الخاص بك هنا)'
        required: true
        type: string

jobs:
  run-windows:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM & Install Dependencies
        run: |
          echo "Checking KVM acceleration..."
          sudo apt-get update
          sudo apt-get install -y qemu-kvm qemu-utils p7zip-full curl wget cpu-checker tightvncserver xvfb
          kvm-ok || true

      - name: Connect to Tailscale VPN
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ github.event.inputs.tailscale_authkey }}
          args: --hostname=windows-qemu-runner --accept-routes

      - name: Download & Extract VectraVM Windows Image
        run: |
          echo "Downloading Windows VHD (windows1121h2)..."
          # ضع رابط التحميل المباشر لملفك هنا
          wget -O windows1121h2.7z "رابط_ملف_الـ_7z_المباشر"
          
          echo "Extracting VHD file..."
          7z x windows1121h2.7z
          ls -la

      - name: Start Windows VM with QEMU & KVM (16GB RAM Context)
        run: |
          echo "Launching QEMU with KVM..."
          # تخصيص رام قوية واستغلال إمكانيات السيرفر
          qemu-system-x86_64 \
            -enable-kvm \
            -m 8G \
            -smp 4 \
            -cpu host \
            -drive file=windows1121h2.vhd,format=vpc \
            -net nic,model=virtio -net user \
            -vga virtio \
            -display vnc=0.0.0.0:0 &
            
          echo "Windows is running and connected via Tailscale!"
          # إبقاء الـ Action مفعلة ومفتوحة لمدة ساعتين لتستمتع بالتحكم بها
          sleep 7200
