name: Run Windows 11 with Tailscale & QEMU

on:
  workflow_dispatch:

jobs:
  run-windows:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM & Install Dependencies
        run: |
          echo "Checking KVM acceleration..."
          sudo apt-get update
          sudo apt-get install -y qemu-kvm qemu-utils p7zip-full curl wget cpu-checker tightvncserver xvfb
          kvm-ok || true

      - name: Install & Connect Tailscale Manually
        run: |
          echo "Installing Tailscale..."
          curl -fsSL https://tailscale.com/install.sh | sh
          
          echo "Connecting to Tailscale VPN..."
          sudo tailscaled &
          sleep 3
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=windows-qemu-runner --accept-routes

      - name: Download & Extract Windows Image (Clean Output)
        run: |
          echo "Downloading Windows VHD archive..."
          wget -O windows11.7z "https://archive.org/download/limbo-pc-emulator-images-7-nbab/Windows%2011%2025H2.7z"
          
          echo "Extracting VHD file silently..."
          7z x windows11.7z -bb0
          
          echo "Listing extracted files:"
          ls -la

      - name: Start Windows VM with QEMU & KVM
        run: |
          echo "Launching QEMU with KVM..."
          VHD_FILE=$(ls *.vhd | head -n 1)
          echo "Using VHD file: $VHD_FILE"
          
          qemu-system-x86_64 \
            -enable-kvm \
            -m 8G \
            -smp 4 \
            -cpu host \
            -drive file="$VHD_FILE",format=vpc \
            -net nic,model=virtio -net user \
            -vga virtio \
            -display vnc=0.0.0.0:0 &
            
          echo "Windows is running with 4 Threads and 8GB RAM, connected via Tailscale!"
          sleep 7200
